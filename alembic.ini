# Alembic configuration for the QFleet accounts database.
#
# Run from the project root:
#     alembic upgrade head
#
# The database URL is NOT set here. It is read from QGF_DATABASE_URL (or the
# SQLite default) inside migrations/env.py, so a connection string with a
# password never has to live in a file that is committed.

[alembic]
script_location = migrations
prepend_sys_path = . backend
version_path_separator = os
# Timestamped revision filenames, so `ls` shows the order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
