# The whole product on one machine: `docker compose up -d` and it is running.
#
# Ports: only nginx is published. The API listens on the private compose
# network where nginx can reach it and the internet cannot, so there is one
# port open on the instance and one thing to secure.
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Same origin, so the browser never makes a cross-origin request and
      # this list is only a backstop. Left empty the API still works.
      QGF_CORS_ORIGINS: ""
      # Set this in a .env file beside this one. Without it the key is random
      # per process and everyone is signed out whenever the container restarts.
      QGF_JWT_SECRET: ${QGF_JWT_SECRET:?set QGF_JWT_SECRET in aws/.env}
      # Demo accounts (ADMIN001 / EMP001). Their passwords are public in this
      # repository — turn this off once judging is over.
      QGF_SEED_DEMO: "true"
      # Unset: SQLite on the volume below. Point it at RDS or Neon to move the
      # accounts off the instance.
      QGF_DATABASE_URL: ${QGF_DATABASE_URL:-}
    volumes:
      # The accounts database outlives the container. Without this, every
      # redeploy resets the employees an admin created.
      - qfleet-data:/app/backend/data
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: aws/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  qfleet-data:
