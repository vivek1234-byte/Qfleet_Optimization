# One origin for the whole product: the browser only ever talks to this server.
#
# That is the difference between this and the Vercel/Render split. There, the
# bundle is on one domain and the API on another, so every call is
# cross-origin and CORS has to be configured and kept in step. Here nginx
# serves the built frontend and forwards /api to the container beside it, so
# there is no preflight, no CORS list, and no VITE_API_BASE_URL — the app asks
# for /api/... on the host it was loaded from, exactly as it does in dev.
server {
    listen 80;
    server_name _;

    # Compress the bundle. ~350 kB of JavaScript becomes ~110 kB on the wire,
    # which is the difference between a demo that snaps and one that hangs on
    # venue wifi.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted filenames, so a year is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API, the interactive docs, and the schema.
    location ~ ^/(api|docs|openapi.json|redoc) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The optimiser streams progress over server-sent events. Buffering
        # holds the whole stream until it closes, so the progress bar would
        # jump from empty to done — the one thing it exists not to do.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Single-page app: any path with no file behind it is the app itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
